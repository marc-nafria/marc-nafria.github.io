<body>

<div id="app"></div>

<script src="js/theory.js?v=88"></script>

<script src="js/tools.js?v=88"></script>
<script src="js/cercle.js?v=88"></script>
<script src="js/practice.js?v=88"></script>
<script src="js/quina.js?v=88"></script>
<script>
Config.load('data/chords.json?v=88').then(function () {
  Practice.start();
  /* els enllaços vells del joc (i el compartir) porten aquí */
  if (location.hash === '#quina') { Quina.open(); }
}).catch(function (err) {
  var msg = String(err && err.message ? err.message : err);
  var hint = location.protocol === 'file:'
    ? 'Estàs obrint el fitxer directament: les dades només carreguen servides per http. Engega un servidor local (python -m http.server) o puja-ho a GitHub Pages.'
    : 'Revisa data/chords.json: segurament hi ha un error de sintaxi a la darrera edició.';
  document.getElementById('app').innerHTML =
    '<div class="boot-error"><b>No s\'han pogut carregar els acords</b><span>' +
    msg.replace(/</g, '&lt;') + '</span><em>' + hint + '</em></div>';
});
</script>
<script>
/* L'app sencera fora de linia. Quan hi ha versio nova esperant, surt
   un avis petit; en tocar-lo, el relleu i recarrega. */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(function (reg) {
    function offer(w) {
      if (!w) { return; }
      var pill = document.createElement('button');
      pill.className = 'update-pill';
      pill.type = 'button';
      pill.textContent = 'versi\u00f3 nova \u00b7 toca per actualitzar';
      pill.onclick = function () { w.postMessage('skip'); };
      document.body.appendChild(pill);
    }
    offer(reg.waiting);
    reg.addEventListener('updatefound', function () {
      var w = reg.installing;
      if (!w) { return; }
      w.addEventListener('statechange', function () {
        if (w.state === 'installed' && navigator.serviceWorker.controller) { offer(w); }
      });
    });
  }).catch(function () { /* file:// o navegador vell: res */ });
  var reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (reloading) { return; }
    reloading = true;
    location.reload();
  });
}
</script>
</body>
</html>
