<!DOCTYPE html>
<html lang="ca" style="background:#060605">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#060605">
<meta name="color-scheme" content="dark light">
<meta name="description" content="Cada dia sona un acord. Troba'l al piano.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>Quinacord</title>
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap">
<link rel="stylesheet" href="quinacord.css?v=9">
</head>
<body>

<!-- Quinacord es un pla mes d'Acords: el wordmark fa de titol d'acord,
     els modes son opcions tipografiques amb el subratllat de la casa,
     l'orella es la de la pantalla de practica i el teclat va contingut
     com als panells. -->
<main class="q">

  <a class="q-back" href="../" aria-label="Tornar a Acords">&#8592;</a>

  <section class="q-stage">
    <div class="q-name" id="q-name" aria-live="polite"></div>

    <div class="q-fails" id="q-miss" aria-label="Errades"></div>

    <div class="q-kb" id="q-kb" aria-label="Teclat"></div>

    <div class="q-row">
      <button type="button" class="pr-ear" id="q-ear" aria-label="Sentir l'acord del dia">
        <i id="q-ear-fill"></i><span>&#9834;</span>
      </button>
      <div class="q-done" id="q-done" hidden>
        <button type="button" class="q-share" id="q-share">comparteix</button>
        <button type="button" class="q-more" id="q-more">seguir jugant</button>
      </div>
    </div>
  </section>

  <a href="../" class="q-made">fet amb &#8249;Acords&#8250;</a>

</main>

<script src="../js/theory.js"></script>
<script src="../js/audio.js"></script>
<script src="../js/piano.js"></script>
<script src="game.js?v=11"></script>
</body>
</html>
